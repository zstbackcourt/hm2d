<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>陆空小怪 · 行为与动作</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f3e9;color:#29443c;font:16px system-ui}main{max-width:1100px;margin:auto;padding:28px 20px}a{color:#486c59}p{color:#65766b;line-height:1.6}button,select{font:inherit;padding:9px 12px;background:#faf9f0;border:1px solid #acb7a5;color:#29443c}button{cursor:pointer}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}section{padding:16px;margin:20px 0;background:#e8ece0;border:1px solid #c3cbb9}canvas{width:100%;height:auto;image-rendering:pixelated}h2{font-size:18px}#status{font-size:14px;min-height:3em}</style><main><a href="/">← 返回狩猎</a><h1>陆空小怪 · 行为与动作</h1><p>每个场景有 3 种候选小怪，每次随机出现 2–3 种，陆空搭配。靠近后每隔 5–8 秒判定一次，攻击概率 20%；不会远处追击。</p><div class="controls"><select id="area" aria-label="场景"><option value="0">废神社</option><option value="1">寒冷群岛</option><option value="2">熔岩洞</option></select><button id="reroll">重新随机出现</button><button id="land">靠近陆地小怪</button><button id="air">靠近飞行小怪</button><button id="away">远离小怪</button><button id="attack">攻击</button><button id="jump">跳跃</button><button id="dodge">翻滚</button></div><canvas id="battle" width="960" height="400"></canvas><p id="status"></p><h2>攻击动作分解</h2><p>下方固定展示全部三招。上方使用真实概率，不会因为打开预览就提高攻击频率。主怪在此静止，便于观察小怪。</p><select id="species" aria-label="小怪种类"></select><div id="sheets"></div><p>本页不读写存档；小怪死亡不会结束任务。当前小怪不产生额外素材奖励，主怪奖励保持不变。</p></main><script type="module" src="./src/small-preview.js"></script></html>
